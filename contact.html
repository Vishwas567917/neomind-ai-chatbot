<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Portfolio</title>
  <meta name="description" content="Get in touch via the contact form.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='0' y2='1'%3E%3Cstop stop-color='%232563eb'/%3E%3Cstop offset='1' stop-color='%2314b8a6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect rx='12' width='64' height='64' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <header class="header" role="banner">
    <div class="container nav" aria-label="Primary">
      <a class="brand" href="index.html">
        <span class="brand__logo" aria-hidden="true"></span>
        <span>My Portfolio</span>
      </a>
      <nav>
        <button id="navToggle" class="nav__toggle" aria-expanded="false" aria-controls="navLinks" aria-label="Toggle navigation">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div id="navLinks" class="nav__links" data-open="false" role="navigation">
          <a href="index.html#home">Home</a>
          <a href="index.html#projects">Projects</a>
          <a href="index.html#skills">Skills</a>
          <a href="about.html">About</a>
          <a href="contact.html" aria-current="page">Contact</a>
        </div>
      </nav>
    </div>
  </header>

  <main id="main" class="container section">
    <h1 class="section__title">Contact</h1>
    <p class="section__subtitle">Have a question or want to work together? Send a message.</p>

    <div class="reveal">
      <form id="contactForm" class="form" aria-describedby="formError formSuccess" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input class="input" type="text" id="name" name="name" placeholder="Your name" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea class="textarea" id="message" name="message" placeholder="How can I help?" required></textarea>
        </div>
        <div class="form__actions">
          <button class="btn btn--primary" type="submit">Send Message</button>
          <span id="formError" class="form__error" role="alert" aria-live="polite"></span>
        </div>
        <p id="formSuccess" class="alert" data-show="false" role="status" aria-live="polite"></p>
        <p class="form__note">This form has client-side validation only. Integrate a backend or service (e.g., Formspree) to receive submissions.</p>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <p>&copy; <span id="year"></span> Your Name. All rights reserved.</p>
    </div>
  </footer>

  <script defer src="assets/js/main.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
